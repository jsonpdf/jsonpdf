name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run --filter './packages/*' build

      - name: Relink workspace bins
        run: vp install --frozen-lockfile

      - name: Typecheck
        run: vp run --no-cache --filter './packages/*' typecheck

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Render examples
        run: vp run --no-cache --filter '@jsonpdf/example-*' render
